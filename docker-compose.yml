services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: marketplace
      POSTGRES_PASSWORD: marketplace
      POSTGRES_DB: marketplace
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U marketplace -d marketplace"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Applies pending Flyway migrations on startup, then serves traffic.
  app:
    build:
      context: .
      secrets:
        - maven_settings
        - maven_settings_security
    environment:
      DATABASE_URL: postgres://marketplace:marketplace@postgres:5432/marketplace?sslmode=disable
      PORT: "8080"
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

# Build-time only: Maven reads these to resolve dependencies through CFA JFrog.
secrets:
  maven_settings:
    file: ${HOME}/.m2/settings.xml
  maven_settings_security:
    file: ${HOME}/.m2/settings-security.xml
